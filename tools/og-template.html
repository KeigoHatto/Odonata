<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OG画像テンプレート（公開物ではない）</title>
<!--
  tools/og-template.html — assets/og-default*.png の版下。

  これは公開ページではない。`node tools/build-og.mjs` が puppeteer-core で
  1200×630 に切り出すためだけに存在する。assets/ にもサイトのページにも
  置かないこと（配信物ではないため / §18-6）。

  言語は URL のクエリで切り替える。
    tools/og-template.html?lang=ja   … 日本語版 → assets/og-default.png
    tools/og-template.html?lang=en   … 英語版   → assets/og-default-en.png

  コピーを変えるときは COPY を書き換えるだけでよい。手で画像を編集しない。
  日本語の改行は <br> で明示する（word-break:auto-phrase は画像生成では
  効きが不安定なため）。word-break:break-all は使わない（§20）。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;position:relative;overflow:hidden;
    background:linear-gradient(150deg,#FFFFFF 0%,#FFFFFF 42%,#F2FBFE 100%);
    font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}

  /* 背景のネットワーク。netbg.js は毎回ランダムなので使わず、種を固定して
     このファイルの中で描く（同じ入力から同じ画像が出ることが要件）。 */
  #net{position:absolute;inset:0;width:1200px;height:630px}

  .logo{position:absolute;left:72px;top:64px;height:84px;width:auto;display:block}

  .copy{position:absolute;left:72px;top:250px;width:900px}
  h1{font-weight:900;font-size:60px;line-height:1.42;color:#0B2A5B;letter-spacing:-.01em}
  p{margin-top:26px;font-weight:500;font-size:25px;line-height:1.6;color:#41616F}

  /* 現行画像の水色バーを踏襲。--color-primary(#00A0E9) は白地 2.91:1 なので使わない。 */
  .bar{position:absolute;left:72px;bottom:72px;width:100px;height:5px;background:#0C7FBE}

  /* §5-5：英語は字間を詰めない。英文は行が長くなるので少し小さくする。 */
  html[lang="en"] h1{letter-spacing:0;font-size:52px;line-height:1.34}
  html[lang="en"] p{letter-spacing:0;font-size:23px}
</style>
</head>
<body>
<canvas id="net" width="1200" height="630"></canvas>
<img class="logo" src="../assets/odonata-logo.png" alt="">
<div class="copy">
  <h1 id="h"></h1>
  <p id="s"></p>
</div>
<div class="bar"></div>
<script>
(function(){
  'use strict';

  // 文言はここだけを書き換える。画像を手で編集しない。
  var COPY = {
    ja: { lang:'ja',
      h:'関係性まで視るデータ分析を、<br>スポーツの当たり前に。',
      s:'GPS・コンディション・傷害履歴・試合を、関係性から読み解く。' },
    en: { lang:'en',
      h:'Football data, read through<br>the relationships between metrics.',
      s:'GPS, condition, injury history and match data — analysed together.' }
  };

  var q = new URLSearchParams(location.search).get('lang');
  var c = COPY[q] || COPY.ja;
  document.documentElement.lang = c.lang;
  document.getElementById('h').innerHTML = c.h;
  document.getElementById('s').innerHTML = c.s;

  // mulberry32。同じ種から必ず同じ配置が出る。
  // 種を変えると全ページの OG が別の見た目になるので、この値は変えない。
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;
    var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296}}
  var rand = rng(20260907);

  var cv = document.getElementById('net');
  var ctx = cv.getContext('2d');
  if (!ctx) return;   // 描けなくても文字は出る（§18-5 プログレッシブエンハンスメント）

  // 文字とロゴの矩形にはノードを置かない。読みづらくなるため。
  var KEEP_OUT = [
    { x:0, y:44,  w:520, h:130 },   // ロゴ
    { x:0, y:236, w:880, h:300 },   // 見出しとサブ
    { x:0, y:534, w:230, h:60  }    // 下線バー
  ];
  function blocked(x, y){
    for (var i=0;i<KEEP_OUT.length;i++){ var r=KEEP_OUT[i];
      if (x>=r.x-16 && x<=r.x+r.w+16 && y>=r.y-16 && y<=r.y+r.h+16) return true; }
    return false;
  }

  // 右へ寄せて撒く。0.55 乗で分布を右に偏らせているだけで、左上・左下にも
  // 少しだけ点が乗る（現行画像の見え方を踏襲）。密にすると図が主役になるので薄く。
  var nodes = [];
  var tries = 0;
  while (nodes.length < 54 && tries < 20000) {
    tries++;
    var x = 40 + Math.pow(rand(), 0.55) * 1140;
    var y = 24 + rand() * 586;
    if (blocked(x, y)) continue;
    // 最小間隔を設けないと右端に固まって「網」ではなく「染み」に見える。
    var ok = true;
    for (var t=0;t<nodes.length;t++){
      var ddx=nodes[t].x-x, ddy=nodes[t].y-y;
      if (ddx*ddx + ddy*ddy < 66*66) { ok = false; break; }
    }
    if (!ok) continue;
    nodes.push({ x:x, y:y, r: 1.5 + rand() * 3.0 });
  }

  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(12,127,190,.28)';
  for (var i=0;i<nodes.length;i++){
    for (var j=i+1;j<nodes.length;j++){
      var dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      if (dx*dx + dy*dy > 118*118) continue;
      ctx.beginPath();
      ctx.moveTo(nodes[i].x, nodes[i].y);
      ctx.lineTo(nodes[j].x, nodes[j].y);
      ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(12,127,190,.55)';
  for (var k=0;k<nodes.length;k++){
    ctx.beginPath();
    ctx.arc(nodes[k].x, nodes[k].y, nodes[k].r, 0, Math.PI*2);
    ctx.fill();
  }
  document.documentElement.setAttribute('data-net-ready', '1');
})();
</script>
</body>
</html>
