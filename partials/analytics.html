<!-- アクセス解析（単一ソース：partials/analytics.html → tools/build-partials.mjs で全ページのヘッド内へ同期）
     GA4 の測定IDを変更するときは、このファイルの2箇所だけを書き換えて同期を実行する（Clarity のIDは1箇所）。
     計測タグ（GA4・Clarity）以外の外部スクリプトはここにも足さない。 -->
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X3FK9YCZG5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-X3FK9YCZG5');
</script>
<!-- Microsoft Clarity（公式スニペット。async で読み込む）。プロジェクトIDはこの1箇所だけで管理する。
     ローカルでの確認作業が録画に混ざらないよう、localhost / 127.0.0.1 / file: では読み込まない（a11y検査も対象外になる）。
     入力内容はマスクする（フォーム欄の data-clarity-mask と Clarity 側の設定の二重）。記載は privacy.html と docs/analytics.md -->
<script>
  (function (c, l, a, r, i, t, y) {
    if (l.location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(l.location.hostname)) { return; }
    c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
    t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i;
    y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
  })(window, document, 'clarity', 'script', 'yo97743hnq');
</script>
<script>
  /* 主要なクリックの計測。onclick 属性は使わず addEventListener でまとめて拾う。
     gtag が無い環境（広告ブロッカー等）でもエラーにならないようガードする。 */
  (function () {
    var send = function (name, params) {
      if (typeof gtag === 'function') { gtag('event', name, params || {}); }
    };
    /* 押された場所を特定する。data-ga-location → ヘッダー/フッター → セクションid → ページ名 の順 */
    var whereFrom = function (el) {
      var tagged = el.closest('[data-ga-location]');
      if (tagged) { return tagged.getAttribute('data-ga-location'); }
      if (el.closest('header.site, header')) { return 'header'; }
      if (el.closest('footer.site, footer')) { return 'footer'; }
      var sec = el.closest('section[id]');
      if (sec) { return sec.id; }
      var page = (location.pathname.split('/').pop() || 'index.html').replace('.html', '');
      return page + '_page';
    };
    /* イベント名と送る条件の一覧は docs/analytics.md。遷移は妨げない。イベントを送るだけ */
    document.addEventListener('click', function (e) {
      var a = e.target.closest('[data-track], a[href]');
      if (!a) { return; }
      /* 明示指定：<a data-track="イベント名" data-location="位置">。ボタンが増えても HTML に属性を足すだけで済むように、
         下の自動判定より優先する。data-location が無ければ whereFrom で補う */
      var track = a.getAttribute('data-track');
      if (track) { send(track, { location: a.getAttribute('data-location') || whereFrom(a) }); return; }
      var href = a.getAttribute('href') || '';
      /* デモ環境（外部）への直リンク。位置は data-demo の値（nav / hero / cta_bottom / footer / demo_page / contact）。
         URLではなく属性で判定するのは、デモURLを tools/build-partials.mjs の1か所だけで管理するため */
      if (a.hasAttribute('data-demo')) { send('click_demo', { location: a.getAttribute('data-demo') }); }
      else if (/(^|\/)contact\.html(\?|#|$)/.test(href)) { send('click_contact', { location: whereFrom(a) }); }
      /* ログイン（別サブドメインへの遷移）。gtag は sendBeacon を使うため遷移中でも送信される */
      else if (/^https?:\/\/app\.getodonata\.com/.test(href)) { send('click_login', { location: whereFrom(a) }); }
    });
    /* お問い合わせフォームの送信完了。purpose は目的の英字ID（option の data-lead）。
       日本語の選択肢文言をそのまま送ると日英で別の値として集計されるため、IDで送る */
    document.addEventListener('odonata:lead', function (e) {
      var purpose = e.detail && e.detail.purpose;
      send('generate_lead', purpose ? { purpose: purpose } : {});
    });
  })();
</script>
